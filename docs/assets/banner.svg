<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bg)" stroke="#262626" stroke-width="1.5"/>

  <!-- Cinema Camera Viewfinder Lens Graphic -->
  <g transform="translate(65, 40)">
    <!-- Lens outer ring -->
    <circle cx="80" cy="80" r="72" fill="#171717" stroke="#404040" stroke-width="3"/>
    <circle cx="80" cy="80" r="56" fill="#0f0f0f" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 4"/>
    <circle cx="80" cy="80" r="40" fill="#050505" stroke="#262626" stroke-width="2"/>
    <circle cx="80" cy="80" r="22" fill="#1c1917" />
    <!-- Recording Red Dot -->
    <circle cx="80" cy="80" r="10" fill="#ef4444" />
    <!-- Framing Crosshairs -->
    <line x1="80" y1="20" x2="80" y2="35" stroke="#737373" stroke-width="1.5"/>
    <line x1="80" y1="125" x2="80" y2="140" stroke="#737373" stroke-width="1.5"/>
    <line x1="20" y1="80" x2="35" y2="80" stroke="#737373" stroke-width="1.5"/>
    <line x1="125" y1="80" x2="140" y2="80" stroke="#737373" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="260" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#amberGold)" letter-spacing="2">
    BLACKMAGIC
  </text>
  <text x="260" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#a3a3a3">
    Native Android Pro Cinema Video Camera &amp; Camera2 Engine
  </text>

  <!-- Spec Badges -->
  <g transform="translate(260, 155)">
    <rect x="0" y="0" width="125" height="24" rx="12" fill="#1c1917" stroke="#44403c"/>
    <text x="62" y="16" font-family="sans-serif" font-size="11" fill="#f59e0b" font-weight="600" text-anchor="middle">ANDROID 15 / API 35</text>

    <rect x="135" y="0" width="105" height="24" rx="12" fill="#1c1917" stroke="#44403c"/>
    <text x="187" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">KOTLIN 2.0</text>

    <rect x="250" y="0" width="115" height="24" rx="12" fill="#1c1917" stroke="#44403c"/>
    <text x="307" y="16" font-family="sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">CAMERA2 API</text>

    <rect x="375" y="0" width="135" height="24" rx="12" fill="#1c1917" stroke="#44403c"/>
    <text x="442" y="16" font-family="sans-serif" font-size="11" fill="#f87171" font-weight="600" text-anchor="middle">HONOR 90 OPTIMIZED</text>
  </g>
</svg>
